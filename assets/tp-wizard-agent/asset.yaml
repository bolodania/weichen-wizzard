apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: tp-wizard-agent
  version: 1.0.0

provides:
  apis:
    - name: tp-wizard-agent
      kind: a2a
      ordId: customer.build:apiResource:tp-wizard-weiche-c5942.tp-wizard-agent:v1
      description: LLM chatbot stretch goal — natural language dialog for Weiche TP creation

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
