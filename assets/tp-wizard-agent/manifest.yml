# XSUAA-protected HTTPS agent; AI Core credentials are injected separately.
applications:
  - name: tp-wizard-agent
    path: .
    memory: 1G
    disk_quota: 2G
    instances: 1
    buildpacks:
      - python_buildpack
    command: python -u app/main.py
    random-route: true
    health-check-type: port
    timeout: 180
    services:
      - tp-wizard-xsuaa
    env:
      AICORE_RESOURCE_GROUP: default
# Cloud Foundry provides PORT. Configure AICORE_* credentials before starting.
# Set CAP_BASE_URL and AGENT_PUBLIC_URL after push using the assigned HTTPS routes.