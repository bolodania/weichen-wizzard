<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TP-Wizard — Freigabe</title>
    <style>html, body, #content { height: 100%; margin: 0; }</style>
    <script>
        // sap.fe.core.AppComponent needs sap.ushell.Container for shell services.
        window.sap = window.sap || {};
        (function() {
            // jQuery-Deferred-compatible promise (sap.fe uses .fail() on the result)
            function jqDeferred(value) {
                var cbs = [], failCbs = [];
                var obj = {
                    done:    function(fn) { fn(value); return obj; },
                    fail:    function()   { return obj; },
                    always:  function(fn) { fn(value); return obj; },
                    then:    function(fn) { fn(value); return obj; },
                    promise: function()   { return obj; }
                };
                return obj;
            }
            function nativePromise(value) {
                // Returns both a native Promise AND jQuery-Deferred interface
                var p = Promise.resolve(value);
                p.fail   = function() { return p; };
                p.done   = function(fn) { p.then(fn); return p; };
                p.always = function(fn) { p.then(fn); return p; };
                return p;
            }
            var emptyAppState = {
                setData: function() {},
                save:    function() { return nativePromise(); },
                getData: function() { return {}; },
                getKey:  function() { return ""; }
            };
            function appState() {
                return {
                    storeInnerAppStateAsync:  function()  { return nativePromise(""); },
                    getInnerAppStateData:     function()  { return nativePromise(null); },
                    createEmptyAppState:      function()  { return emptyAppState; },
                    createEmptyAppStateAsync: function()  { return nativePromise(emptyAppState); },
                    getStartupAppState:       function()  { return nativePromise(emptyAppState); }
                };
            }
            function nav() {
                return {
                    toExternal:               function()    {},
                    getSemanticObjectLinks:   function()    { return nativePromise([]); },
                    isIntentSupported:        function(aI)  { var r={}; (aI||[]).forEach(function(i){r[i]={supported:false};}); return nativePromise(r); },
                    isNavigationSupported:    function(aI)  { return nativePromise((aI||[]).map(function(){return{supported:false};})); },
                    hrefForExternal:          function()    { return "#"; },
                    registerNavigationFilter: function()    {},
                    getStartupAppState:       function()    { return nativePromise(emptyAppState); }
                };
            }
            function urlParsing() {
                return {
                    parseShellHash:     function()  { return {}; },
                    splitHash:          function(h) { return { shellPart: "", appSpecificPart: h || "" }; },
                    constructShellHash: function()  { return ""; },
                    getShellHash:       function(s) { var m = (s || window.location.href).match(/#(.*)/); return m ? "#" + m[1] : ""; },
                    getHash:            function(s) { var m = (s || window.location.href).match(/#(.*)/); return m ? m[1] : ""; }
                };
            }
            function svc(n) {
                if (n === "AppState")                   return appState();
                if (n === "CrossApplicationNavigation") return nav();
                if (n === "URLParsing")                 return urlParsing();
                // Minimal stub for any other service sap.fe requests
                return {
                    registerNavigationFilter: function() {},
                    toExternal:               function() {},
                    hrefForExternal:          function() { return "#"; },
                    getStartupAppState:       function() { return nativePromise(emptyAppState); }
                };
            }
            window.sap.ushell = {
                Container: {
                    getService:      svc,
                    getServiceAsync: function(n) { return Promise.resolve(svc(n)); },
                    getUser: function() {
                        return {
                            getContentDensity: function() { return "compact"; },
                            getFullName:       function() { return "Thomas"; },
                            getEmail:          function() { return ""; },
                            getId:             function() { return "THOMAS"; },
                            getLanguage:       function() { return "DE"; },
                            isJamActive:       function() { return false; }
                        };
                    },
                    attachRendererCreatedEvent: function() {},
                    detachRendererCreatedEvent: function() {},
                    createRenderer:             function() { return Promise.resolve(); }
                }
            };
        })();
    </script>
    <script id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.120.28/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{"tp.wizard.approve": "./"}'
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-preload=""
        data-sap-ui-frameOptions="allow"
        data-sap-ui-flexibilityServices='[{"connector":"LocalStorageConnector"}]'
    ></script>
    <script>
        sap.ui.require([
            "sap/ui/core/service/ServiceFactory",
            "sap/ui/core/service/ServiceFactoryRegistry",
            "sap/ui/core/ComponentContainer"
        ], function(ServiceFactory, ServiceFactoryRegistry, ComponentContainer) {

            // sap.fe.core.AppComponent looks up ShellUIService via ServiceFactoryRegistry
            // (not via Container.getService). Without FLP sandbox this factory is never
            // auto-registered, so we provide a minimal mock as a proper ServiceFactory
            // subclass to satisfy the instanceof assertion.
            var ShellUIServiceFactory = ServiceFactory.extend("tp.wizard.mock.ShellUIServiceFactory", {
                createInstance: function() {
                    var oSvc = {
                        init:              function() {},
                        exit:              function() {},
                        destroy:           function() {},
                        setTitle:          function() {},
                        setHierarchy:      function() {},
                        setRelatedApps:    function() {},
                        setBackNavigation: function() {},
                        getInterface:      function() { return oSvc; }
                    };
                    return Promise.resolve(oSvc);
                }
            });
            ServiceFactoryRegistry.register("sap.ushell.ui5service.ShellUIService", new ShellUIServiceFactory());

            new ComponentContainer({
                name: "tp.wizard.approve",
                settings: { id: "tp.wizard.approve" },
                async: true,
                height: "100%"
            }).placeAt("content");
        });
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
</body>
</html>
