apiVersion: asset.sap/v1
kind: Asset
type: cap

metadata:
  name: tp-wizard-cap
  version: 1.0.0
  description: >
    CAP backend (rule engine + S/4HANA FL integration) and React/UI5 wizard
    frontend for guided Technische-Platz creation at DB InfraGO.

container:
  buildPath: .
  port: 4004

provides:
  apis:
    - name: tp-wizard-cap
      kind: rest
      ordId: customer.build:apiResource:tp-wizard-weiche-c5942.tp-wizard-cap:v1
      description: Wizard session management and TP derivation REST API

probes:
  startup:
    path: /health
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
